name: Market Regime Pipeline

on:
  schedule:
    - cron: '0 12 * * 1-5'  # Runs Monday through Friday after market close (UTC)
  workflow_dispatch:        # Allows manual triggering from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy pandas yfinance scikit-learn matplotlib

      - name: Train model and generate CAGR plot
        run: |
          python regime_model.py

      - name: Upload performance chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: nifty-regime-cagr-chart
          path: nifty_regime_cagr.png
          retention-days: 30
