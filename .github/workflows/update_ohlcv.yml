name: Update Nifty 500 OHLCV Data

on:
  schedule:
    # Runs at 14:00 UTC (19:30 IST) every Monday through Friday (post-market close)
    - cron: '0 14 * * 1-5'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  fetch-and-update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data download script
        run: python download_data.py

      - name: Commit and Push Parquet File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nifty500_ohlcv.parquet
          
          # Only commit if the file has changed
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "Auto-update Nifty 500 OHLCV data"
            git push
          fi
