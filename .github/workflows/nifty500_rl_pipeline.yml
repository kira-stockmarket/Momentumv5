name: Nifty 500 Two-Tier RL Strategy

on:
  schedule:
    # Runs at 14:30 UTC (20:00 IST) Monday to Friday
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Train & Walk-Forward Evaluate RL Agent
        run: python rl_execution_agent.py

      - name: Step 2 - Run Daily Live Decision Engine
        run: |
          python run_daily_pipeline.py
          cat daily_signals.md >> $GITHUB_STEP_SUMMARY

      - name: Step e - Commit Models & Signal Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tier2_ppo_agent.zip daily_signals.md
          
          if git diff --staged --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "Automated update: Nifty 500 Data, Models & Daily Signals [skip ci]"
            git push
          fi
