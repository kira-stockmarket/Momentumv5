name: Run Strategy Backtest

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Backtest Engine
        run: |
          python backtest.py | tee backtest_results.txt

      - name: Publish Summary to UI
        run: |
          echo "## 📊 Strategy Backtest Performance (OOS)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat backtest_results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Save Log Artifacts & Trade CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the text results and the newly generated CSV file
          git add backtest_results.txt backtest_trades.csv || true
          
          if git diff --staged --quiet; then
            echo "No changes to log."
          else
            git commit -m "Update backtest results and trade log [skip ci]"
            git push
          fi
