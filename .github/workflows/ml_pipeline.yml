name: Nifty 500 ML Breakout Screener

on:
  schedule:
    # Runs at 14:30 UTC (20:00 IST) every Monday through Friday
    - cron: '30 14 * * 1-5'
  workflow_dispatch: # Allows manual execution from the Actions tab

jobs:
  run-ml-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Train LightGBM Model
        run: python train_tier1_lgbm.py

      - name: Step e - Commit Models & Signal Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nifty500_ohlcv.parquet tier1_lgbm_model.pkl tier1_threshold.pkl 
          
          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-update data, retrain model, and log daily setups"
            git push
          fi
