name: Market Regime Pipeline

on:
  schedule:
    - cron: '0 12 * * 1-5'  
  workflow_dispatch:        

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # Changed: Removed torch, added hmmlearn
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas yfinance scikit-learn matplotlib hmmlearn

      - name: Train HMM model and generate CAGR plot
        # Ensure the filename matches what you committed to GitHub!
        run: |
          python regime_model.py

      - name: Upload performance chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: nifty-regime-cagr-chart
          path: nifty_regime_cagr.png
          retention-days: 30
