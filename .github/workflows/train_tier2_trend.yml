name: Train Tier 2 Trend Agent

on:
  workflow_dispatch: # Allows manual trigger so you only spend compute when you want to retrain

jobs:
  train-rl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Trend-Following PPO Agent
        run: |
          python train_tier2_trend.py

      - name: Commit and Push New Model
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the newly created trend model
          git add tier2_ppo_trend.zip || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Tier 2 Trend RL model [skip ci]"
            git push
          fi
