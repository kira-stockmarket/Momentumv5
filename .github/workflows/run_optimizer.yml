name: Run Portfolio Optimizer

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Portfolio Optimizer
        run: |
          python portfolio_optimizer.py | tee optimizer_results.txt

      - name: Publish Leaderboard to UI
        run: |
          echo "## 🏆 Portfolio Optimization Leaderboard" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat optimizer_results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Save Log & CSV Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the text results and the newly generated CSV file
          git add optimizer_results.txt portfolio_optimization_results.csv || true
          
          if git diff --staged --quiet; then
            echo "No changes to log."
          else
            git commit -m "Update portfolio optimization leaderboard [skip ci]"
            git push
          fi
